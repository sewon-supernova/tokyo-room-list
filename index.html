<title>クルマのある1LDK</title>
<style>
:root {
  --bg:#fbfaf8; --card:#ffffff; --ink:#252320; --sub:#6d6a63; --faint:#9b978e;
  --rule:#e4e0d8; --accent:#35526e; --accent-bg:#eef2f6;
  --ok:#2c6a4e; --ok-bg:#e8f1ec; --warn:#8b6a2e; --warn-bg:#f5efe2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#16181b; --card:#1e2125; --ink:#e8e6e1; --sub:#a09c94; --faint:#6f6b63;
    --rule:#2c3036; --accent:#8fb2d6; --accent-bg:#1f2a35;
    --ok:#7cbd9c; --ok-bg:#1a2a22; --warn:#cfa464; --warn-bg:#2b2415;
  }
}
:root[data-theme="dark"] {
  --bg:#16181b; --card:#1e2125; --ink:#e8e6e1; --sub:#a09c94; --faint:#6f6b63;
  --rule:#2c3036; --accent:#8fb2d6; --accent-bg:#1f2a35;
  --ok:#7cbd9c; --ok-bg:#1a2a22; --warn:#cfa464; --warn-bg:#2b2415;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",
    "Apple SD Gothic Neo",system-ui,sans-serif;
  font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:680px;margin:0 auto;padding:0 0 56px}
header{padding:22px 16px 14px;border-bottom:1px solid var(--rule);background:var(--card)}
h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.02em}
.stamp{margin-top:3px;color:var(--faint);font-size:11.5px;
  font-variant-numeric:tabular-nums}
.cond{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.cond span{font-size:11px;line-height:1.5;padding:2px 7px;border:1px solid var(--rule);
  color:var(--sub);border-radius:3px;white-space:nowrap}
.cond span.k{border-color:transparent;background:var(--accent-bg);color:var(--accent);
  font-weight:600}
nav{position:sticky;top:0;z-index:5;display:flex;gap:0;overflow-x:auto;
  background:var(--card);border-bottom:1px solid var(--rule);
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav button{font:inherit;font-size:13px;font-weight:600;white-space:nowrap;
  background:none;border:0;border-bottom:2px solid transparent;color:var(--faint);
  padding:11px 14px;cursor:pointer;min-height:44px}
nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.note{padding:11px 16px 0;color:var(--faint);font-size:11.5px}
.filters{background:var(--card);border-bottom:1px solid var(--rule);padding:0 16px}
.fhead{display:flex;align-items:center;justify-content:space-between;
  padding:11px 0;cursor:pointer;min-height:44px}
.fhead span{font-size:12.5px;font-weight:600;color:var(--sub)}
.fhead em{font-style:normal;font-size:11.5px;color:var(--accent);
  font-variant-numeric:tabular-nums}
.fbody{padding:0 0 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fbody[hidden]{display:none}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:11px;color:var(--faint)}
.f select{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);
  border:1px solid var(--rule);border-radius:4px;padding:8px 9px;min-height:40px;
  appearance:none;width:100%}
.f select:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
.toggles{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.toggles button{font:inherit;font-size:11.5px;padding:7px 11px;min-height:36px;
  border:1px solid var(--rule);background:var(--bg);color:var(--sub);
  border-radius:999px;cursor:pointer}
.toggles button[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent);
  border-color:transparent;font-weight:600}
.toggles button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.reset{grid-column:1/-1;justify-self:start;font:inherit;font-size:11.5px;
  background:none;border:0;color:var(--faint);text-decoration:underline;
  cursor:pointer;padding:6px 0;min-height:32px}
.list{display:flex;flex-direction:column}
.item{background:var(--card);border-bottom:1px solid var(--rule);padding:13px 16px}
.top{display:flex;gap:10px;align-items:baseline}
.no{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;
  min-width:17px;padding-top:2px}
.name{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.4;
  color:var(--ink);text-decoration:none;word-break:break-word}
.name:active{color:var(--accent)}
.price{text-align:right;white-space:nowrap}
.price b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;
  letter-spacing:-.01em}
.price i{display:block;font-style:normal;font-size:10.5px;color:var(--faint);
  font-variant-numeric:tabular-nums}
.addr{margin:4px 0 0 27px;color:var(--sub);font-size:11.5px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:7px 0 0 27px}
.tags span{font-size:11px;line-height:1.6;padding:1px 6px;border-radius:3px;
  background:var(--bg);border:1px solid var(--rule);color:var(--sub);
  font-variant-numeric:tabular-nums}
.tags span.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok);
  font-weight:600}
.tags span.wa{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.tags span.ac{background:var(--accent-bg);border-color:transparent;color:var(--accent);
  font-weight:600}
.links{display:flex;gap:14px;margin:9px 0 0 27px}
.links a{font-size:11.5px;color:var(--accent);text-decoration:none;
  padding:5px 0;min-height:30px;display:inline-flex;align-items:center}
.links a:active{text-decoration:underline}
footer{padding:18px 16px;color:var(--faint);font-size:11px}
@media(min-width:560px){
  .wrap{padding-bottom:64px}
  header,.item{padding-left:20px;padding-right:20px}
}
</style>

1%20%E6%9C%88%E6%A5%B5%E9%A7%90%E8%BB%8A%E5%A0%B4"}];
const TABS=[{"id": "value", "label": "コスパ", "note": "㎡あたりの家賃が安い順"}, {"id": "cheap", "label": "家賃", "note": "管理費込みの家賃が安い順"}, {"id": "initial", "label": "初期費用", "note": "敷金・礼金の負担が軽い順"}, {"id": "wide", "label": "広さ", "note": "専有面積が広い順"}, {"id": "work", "label": "会社に近い", "note": "アークヒルズまでの距離が近い順"}, {"id": "station", "label": "駅チカ", "note": "駅までの徒歩が短い順"}, {"id": "new", "label": "築浅", "note": "築年数が浅い順"}, {"id": "parking", "label": "駐車場あり", "note": "駐車場の料金が確認できた物件"}, {"id": "ginza", "label": "銀座", "note": "銀座までドアツードアが短い順"}];
const SORT={
  value:r=>r.ppm,
  cheap:r=>r.rent,
  initial:r=>(r.shiki+r.rei)*1e7+r.rent,
  wide:r=>-r.area,
  work:r=>r.ark===null?99:r.ark,
  station:r=>r.walk*1e7+r.rent,
  new:r=>r.age*1e7+r.rent,
  parking:r=>r.pfee===null?1e9:r.total,
  ginza:r=>r.ginza||99
};
const man=n=>(n/10000).toFixed(1)+'万';

const $=s=>document.querySelector(s);
const F={
  rent:'f-rent',ginza:'f-ginza',area:'f-area',ark:'f-ark'
};
const T={park:'t-park',shiki:'t-shiki',new:'t-new',walk:'t-walk',one:'t-1ldk',two:'t-2ldk'};
const num=id=>parseFloat($('#'+id).value);
const on=id=>$('#'+id).getAttribute('aria-pressed')==='true';

function passes(r){
  if(r.rent>num(F.rent))return false;
  if((r.ginza||99)>num(F.ginza))return false;
  if(r.area<num(F.area))return false;
  const ak=num(F.ark);
  if(ak<99&&(r.ark===null||r.ark>ak))return false;
  if(on(T.one)&&r.layout!=='1LDK')return false;
  if(on(T.two)&&r.layout!=='2LDK')return false;
  if(on(T.park)&&r.pfee===null)return false;
  if(on(T.shiki)&&r.shiki!==0)return false;
  if(on(T.new)&&r.age>3)return false;
  if(on(T.walk)&&r.walk>7)return false;
  return true;
}

function rowsFor(id){
  let a=DATA.filter(passes);
  if(id==='parking')a=a.filter(r=>r.pfee!==null);
  a.sort((x,y)=>SORT[id](x)-SORT[id](y));
  return a.slice(0,25);
}

function el(tag,cls,txt){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(txt!==undefined)e.textContent=txt;
  return e;
}

function item(r,i){
  const box=el('div','item');

  const top=el('div','top');
  top.appendChild(el('div','no',String(i+1).padStart(2,'0')));
  const a=el('a','name',r.name);
  a.href=r.url;a.target='_blank';a.rel='noopener';
  top.appendChild(a);
  const p=el('div','price');
  p.appendChild(el('b',null,man(r.rent)));
  p.appendChild(el('i',null,'駐車込 約'+man(r.total)));
  top.appendChild(p);
  box.appendChild(top);

  box.appendChild(el('div','addr',r.addr+'　'+r.line+'／'+r.st+'駅 徒歩'+r.walk+'分'));

  const tags=el('div','tags');
  const t=[];
  t.push([r.shiki===0?'ok':'ok', r.shiki===0?'敷礼0':'礼0・敷'+r.shiki]);
  t.push(['', r.layout+' '+r.area+'㎡']);
  t.push([r.age<=3?'ac':'', r.age===0?'新築':'築'+r.age+'年']);
  if(r.ark!==null)t.push(['','会社まで'+r.ark+'km']);
  if(r.ginza)t.push(['','銀座'+r.ginza+'分']);
  t.push(r.pfee!==null?['ac','駐車場 '+man(r.pfee)]:['wa','駐車場 要確認']);
  t.forEach(([c,x])=>tags.appendChild(el('span',c,x)));
  box.appendChild(tags);

  const links=el('div','links');
  [['SUUMOで見る',r.url],['地図',r.map],['月極駐車場',r.park]].forEach(([label,href])=>{
    const l=el('a',null,label);
    l.href=href;l.target='_blank';l.rel='noopener';
    links.appendChild(l);
  });
  box.appendChild(links);
  return box;
}

let current='value';

function show(id,scroll){
  current=id;
  const meta=TABS.find(t=>t.id===id);
  $('#note').textContent=meta.note;
  document.querySelectorAll('#tabs button').forEach(b=>
    b.setAttribute('aria-selected',String(b.dataset.id===id)));
  const list=$('#list');
  list.textContent='';
  const rows=rowsFor(id);
  $('#fcount').textContent=DATA.filter(passes).length+'件';
  if(!rows.length){
    list.appendChild(el('p','note','条件に合う物件がありません。絞り込みをゆるめてみてください。'));
    return;
  }
  rows.forEach((r,i)=>list.appendChild(item(r,i)));
  if(scroll)window.scrollTo({top:0,behavior:'smooth'});
}

const nav=$('#tabs');
TABS.forEach(t=>{
  const b=el('button',null,t.label);
  b.type='button';b.setAttribute('role','tab');b.dataset.id=t.id;
  b.addEventListener('click',()=>show(t.id,true));
  nav.appendChild(b);
});

Object.values(F).forEach(id=>
  $('#'+id).addEventListener('change',()=>show(current,false)));
Object.values(T).forEach(id=>{
  const b=$('#'+id);
  b.addEventListener('click',()=>{
    b.setAttribute('aria-pressed',String(!on(id)));
    show(current,false);
  });
});
$('#f-reset').addEventListener('click',()=>{
  Object.values(F).forEach(id=>{$('#'+id).selectedIndex=0;});
  Object.values(T).forEach(id=>$('#'+id).setAttribute('aria-pressed','false'));
  show(current,false);
});
const fh=$('#fhead'),fb=$('#fbody');
function toggleF(){
  const open=fb.hasAttribute('hidden');
  if(open)fb.removeAttribute('hidden');else fb.setAttribute('hidden','');
  fh.setAttribute('aria-expanded',String(open));
}
fh.addEventListener('click',toggleF);
fh.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleF();}
});

show('value',false);
</script>
